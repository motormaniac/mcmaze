[project]
name = "mazegenerate-scripts"
version = "0.1.0"
description = "Helper scripts that generate Minecraft commands for the maze project"
requires-python = ">=3.14"
dependencies = [
    "nbtlib>=2.0.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["compile", "sim"]
testpaths = ["compile/tests", "sim/tests"]

[tool.poe.tasks]
mct = { cmd = "python ${POE_ROOT}/compile/main.py", cwd = "${POE_PWD}", help = "Compile .mct to IR (.irt) and build schematics; --ir writes IR, --schem a schematic" }
rooms = { cmd = "python ${POE_ROOT}/rooms/rooms.py", cwd = "${POE_PWD}", help = "Build the maze2 lookups/place IR from the room sheet; no file downloads the sheet to rooms/rooms.csv first" }
