[project]
name = "mazegenerate-scripts"
version = "0.1.0"
description = "Helper scripts that generate Minecraft commands for the maze project"
requires-python = ">=3.14"
dependencies = [
    "nbtlib>=2.0.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["compile", "sim"]
testpaths = ["compile/tests", "sim/tests"]
